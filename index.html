<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopify External App Release</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
          sans-serif;
        color: #202223;
        background: #f6f6f7;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      main {
        max-width: 560px;
        background: #fff;
        border: 1px solid #e1e3e5;
        border-radius: 12px;
        padding: 32px;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.05), 0 2px 16px rgba(0, 0, 0, 0.06);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 12px;
        line-height: 1.6;
        color: #6d7175;
      }

      a {
        color: #008060;
        font-weight: 600;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .link-card {
        display: block;
        margin-top: 20px;
        padding: 16px 18px;
        border: 1px solid #c9e0ff;
        border-radius: 10px;
        background: #f0f7ff;
      }

      .link-card strong {
        display: block;
        margin-bottom: 6px;
        color: #202223;
      }

      .link-card span {
        font-size: 0.9rem;
        color: #6d7175;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Shopify External App Release</h1>
      <p>
        本仓库提供可在 GitHub Pages 等静态站点托管的 Shopify 工具。当前包含 Admin API Token
        生成器（Embedded = false）：通过 OAuth 授权后，在本地终端执行 CURL 换取 Access Token。
      </p>

      <a class="link-card" href="./token-generator-not-embedded/">
        <strong>Shopify Admin API Token 生成器</strong>
        <span>OAuth 授权 · 终端 CURL 换 Token · 支持 Offline / Online Token</span>
      </a>
    </main>
  </body>
</html>
